<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои сертификаты</title>
  <link rel="canonical" href="sitemap.xml">
  <style>
     :root {
      --bg: #f5f8fb;                    /* очень светлый голубовато-серый */
      --bg-card: #ffffff;
      --text: #1a2b3c;                  /* тёмно-синий вместо чёрного */
      --text-muted: #5a7085;            /* приглушённый серо-синий */
      --primary: #0e6ba8;               /* медицинский синий */
      --primary-dark: #0a4f7c;
      --primary-soft: #e3f0f8;
      --accent: #2ec4b6;                /* бирюзовый акцент — как стетоскоп */
      --border: #d9e3ec;
      --radius: 14px;
      --shadow-sm: 0 2px 10px rgba(14, 107, 168, 0.06);
      --shadow-lg: 0 18px 42px rgba(14, 107, 168, 0.16);
    }

        * { box-sizing: border-box; }

    body {
       font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 48px 24px 80px;
        line-height: 1.55;
        background-image:
          radial-gradient(circle at 10% 0%, rgba(14, 107, 168, 0.05) 0%, transparent 40%),
          radial-gradient(circle at 90% 100%, rgba(46, 196, 182, 0.05) 0%, transparent 40%);
        background-attachment: fixed;
      }

    .container { max-width: 1240px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 56px; }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--primary);
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      margin: 0 0 12px;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin: 0 auto;
      max-width: 560px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      margin: 24px auto 0;
      border-radius: 3px;
      opacity: 0.85;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .cert-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition:
        transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.3s ease;
    }

    .cert-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(14, 107, 168, 0.3);
    }

    /* Превью — 3/4, ни портрет, ни пейзаж не режутся */
    .cert-thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    /* Внутренняя золотая рамка-паспарту */
    .cert-thumb::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(201, 169, 97, 0.35);
      border-radius: 8px;
      pointer-events: none;
      transition: border-color 0.4s ease, inset 0.4s ease;
    }

    .cert-card:hover .cert-thumb::before {
      border-color: rgba(201, 169, 97, 0.9);
      inset: 6px;
    }

    .cert-thumb img,
    .cert-thumb iframe {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: cover;         /* ← заполняет всю карточку */
      object-position: center;   /* ← показывает центральную часть */
      border: none;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(80, 60, 40, 0.12);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.4s ease;
      z-index: 1;
    }

    .cert-card:hover .cert-thumb img,
    .cert-card:hover .cert-thumb iframe {
      transform: scale(1.04);
      box-shadow: 0 12px 30px rgba(80, 60, 40, 0.22);
    }

    .cert-info {
      padding: 16px 18px 18px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cert-title {
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: 1.02rem;
      margin: 0;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cert-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Плашка типа файла */
    .cert-type {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--primary);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 4px 9px;
      border-radius: 100px;
      border: 1px solid rgba(14, 107, 168, 0.2);
      text-transform: uppercase;
    }

    /* Круглая стрелка «открыть» */
    .cert-open {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 2;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      box-shadow: 0 6px 16px rgba(14, 107, 168, 0.4);
    }

    .cert-card:hover .cert-open {
      opacity: 1;
      transform: translateY(0);
    }

    .loading,
    .error {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      font-size: 1rem;
    }

    .loading::before {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 3px solid var(--primary-soft);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: var(--primary); }

    /* ===== Метка «часов обучения» — благородный сине-серый ===== */
    .cert-hours {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px 5px 9px;
      border-radius: 100px;

      /* Мягкий градиент: от серо-синего к глубокому графиту */
      background: linear-gradient(135deg, #5c7185 0%, #3d4f60 100%);
      color: #f1f6fa;

      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 3px 10px rgba(45, 60, 75, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);

      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
      line-height: 1;

      pointer-events: none;
      transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.35s ease;
    }

    .cert-hours__icon {
      font-size: 0.9em;
      line-height: 1;
      color: #a8c4dc;                            /* светлый серебристо-голубой */
      filter: drop-shadow(0 0 2px rgba(168, 196, 220, 0.5));
    }

    .cert-hours__value {
      letter-spacing: 0.4px;
      color: #f1f6fa;
    }

    .cert-card:hover .cert-hours {
      transform: translateY(-2px) scale(1.04);
      box-shadow:
        0 6px 16px rgba(45, 60, 75, 0.5),
        0 0 14px rgba(168, 196, 220, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    /* Тёмная тема — та же логика, что у .cert-type */
      
      @media (prefers-color-scheme: dark) {
      .cert-hours {
        background: linear-gradient(135deg, #6a8296 0%, #4a5c6d 100%);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.22);
        box-shadow:
          0 3px 10px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .cert-hours__icon {
        color: #c6dbea;
        filter: drop-shadow(0 0 3px rgba(198, 219, 234, 0.6));
      }
      .cert-card:hover .cert-hours {
        box-shadow:
          0 6px 16px rgba(0, 0, 0, 0.6),
          0 0 18px rgba(198, 219, 234, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
    }

        @media (max-width: 600px) {
          body { padding: 28px 16px 60px; }
          header { margin-bottom: 36px; }
          .gallery {
            gap: 18px;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
          }
          .cert-info { padding: 14px 14px 16px; }
          .cert-title { font-size: 0.95rem; }
        }
        /* Красивая заглушка для PDF */
    .cert-pdf-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fdf6f7 0%, #f4e3e7 100%);
      border-radius: 6px;
      border: 1px dashed rgba(183, 46, 74, 0.35);
    }

    .cert-pdf-icon {
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: 1px;
      color: var(--primary);
      background: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(183, 46, 74, 0.18);
    }

    .cert-pdf-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    /* Тёмная тема */
    @media (prefers-color-scheme: dark) {
      .cert-pdf-preview {
        background: linear-gradient(135deg, #2a231e 0%, #1f1a17 100%);
        border-color: rgba(230, 136, 154, 0.35);
      }
      .cert-pdf-icon {
        background: #211c19;
        color: #e6889a;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      }
    }
    /* Контейнер для PDF-превью */
    .cert-pdf-canvas {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .cert-pdf-canvas canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(80, 60, 40, 0.12);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.4s ease;
      z-index: 1;
      background: #fff;
    }

    .cert-card:hover .cert-pdf-canvas canvas {
      transform: scale(1.04);
      box-shadow: 0 12px 30px rgba(80, 60, 40, 0.22);
    }

    /* Запасная надпись, если PDF не удалось отрендерить */
    .cert-pdf-fallback {
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: 1px;
      color: var(--primary);
      background: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(183, 46, 74, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      .cert-pdf-canvas canvas {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }
      .cert-pdf-fallback {
        background: #211c19;
        color: #e6889a;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      }
    }

    /* Кнопка переключения темы */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--primary);
      font-size: 20px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle:hover {
      transform: scale(1.1);
      box-shadow: var(--shadow-lg);
    }

    /* Ручная тёмная тема (когда пользователь нажал кнопку) */
    html[data-theme="dark"] {
      --bg: #0f1a24;
      --bg-card: #16232f;
      --text: #e6eef5;
      --text-muted: #8fa4b8;
      --border: #23333f;
      --primary: #4da6d9;
      --primary-dark: #2b7bb0;
      --primary-soft: rgba(77, 166, 217, 0.15);
      --accent: #45d6c7;
    }
    html[data-theme="dark"] body {
      background-image:
        radial-gradient(circle at 10% 0%, rgba(77, 166, 217, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(69, 214, 199, 0.06) 0%, transparent 40%);
    }
    html[data-theme="dark"] .cert-type {
      background: rgba(22, 35, 47, 0.9);
      color: var(--primary);
      border-color: rgba(77, 166, 217, 0.3);
    }

    /* Навигация */
    .nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      border-radius: 100px;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      border: 1.5px solid transparent;
    }
    .nav a.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 6px 20px rgba(14, 107, 168, 0.3);
    }
    .nav a:not(.active) {
      background: var(--bg-card);
      color: var(--primary);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }
    .nav a:not(.active):hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .nav .nav-icon { font-size: 1.1em; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    // ====== НАСТРОЙКИ — МЕНЯЙТЕ ТОЛЬКО ЭТО ======
    const OWNER  = 'NatalyaSvetlakova';
    const REPO   = 'ns-medical-profile'; //
    const FOLDER = 'certificates';            //

    const IMAGE_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'jfif', 'bmp'];
    const PDF_EXT   = ['pdf'];

    // Эти словари НЕОБЯЗАТЕЛЬНЫ. Заполняйте по мере необходимости.

    const gallery = document.getElementById('gallery');

    function getExt(name) {
      const i = name.lastIndexOf('.');
      return i === -1 ? '' : name.slice(i + 1).toLowerCase();
    }
    function getBase(name) {
      const i = name.lastIndexOf('.');
      return i === -1 ? name : name.slice(0, i);
    }
    function humanize(name) {
      const m = name.match(/^certificate[_\-\s]+(\d{2})\.(\d{2})\.(\d{2})$/i);
      if (m) {
        const [, d, mo, y] = m;
        return `Сертификат · ${d}.${mo}.20${y}`;
      }
      return name
        .replace(/[-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/^\w/, c => c.toUpperCase());
    }
    function pluralHours(n) {
      const num = Math.abs(n) % 100;
      const lastDigit = num % 10;

      if (num >= 11 && num <= 14) return 'часов';
      if (lastDigit === 1) return 'час';
      if (lastDigit >= 2 && lastDigit <= 4) return 'часа';
      return 'часов';
    }
    function encodePath(p) {
      return p.split('/').map(encodeURIComponent).join('/');
    }
    function pluralHours(n) {
      const num = Math.abs(n) % 100;
      const lastDigit = num % 10;
      if (num >= 11 && num <= 14) return 'часов';
      if (lastDigit === 1) return 'час';
      if (lastDigit >= 2 && lastDigit <= 4) return 'часа';
      return 'часов';
    }

    // ===== Переключатель темы =====
(function initTheme() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);

  const btn = document.getElementById('theme-toggle');
  const icon = btn.querySelector('.theme-toggle__icon');
  icon.textContent = theme === 'dark' ? '☀️' : '🌙';

  btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    icon.textContent = next === 'dark' ? '☀️' : '🌙';
  });
})();

    async function loadCertificates() {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;

      let files;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('GitHub API: ' + res.status);
        files = await res.json();
      } catch (err) {
        gallery.innerHTML = `<div class="error">Не удалось загрузить сертификаты.<br>${err.message}</div>`;
        return;
      }

      if (!Array.isArray(files) || files.length === 0) {
        gallery.innerHTML = `<div class="error">В папке «${FOLDER}» пока нет файлов.</div>`;
        return;
      }

      const certs = files.filter(f => f.type === 'file' && (
        IMAGE_EXT.includes(getExt(f.name)) || PDF_EXT.includes(getExt(f.name))
      ));

      if (certs.length === 0) {
        gallery.innerHTML = `<div class="error">Файлы есть, но среди них нет картинок или PDF.</div>`;
        return;
      }

      // Извлекаем дату из имени файла (DD.MM.YYYY, DD.MM.YY, YYYY.MM.DD)
function parseDateFromName(name) {
  const base = getBase(name);

  // 1) СНАЧАЛА проверяем YYYY.MM.DD или YYYY-MM-DD
  let m = base.match(/(\d{4})[.\-](\d{2})[.\-](\d{2})/);
  if (m) {
    const [, y, mo, d] = m;
    return new Date(+y, +mo - 1, +d).getTime();
  }

  // 2) Потом DD.MM.YYYY или DD.MM.YY
  m = base.match(/(\d{2})\.(\d{2})\.(\d{4}|\d{2})/);
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = '20' + y;
    return new Date(+y, +mo - 1, +d).getTime();
  }

  return 0;
}

// Сортировка: сначала новые (по убыванию даты)
certs.sort((a, b) => {
  const da = parseDateFromName(a.name);
  const db = parseDateFromName(b.name);
  if (db !== da) return db - da;
  // Если даты одинаковые — по имени по убыванию
  return b.name.localeCompare(a.name, 'ru');
});

      gallery.innerHTML = certs.map(file => {
        const ext = getExt(file.name);
        const base = getBase(file.name);
        const isPdf = PDF_EXT.includes(ext);
        const fileUrl = file.download_url
          || `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FOLDER}/${encodePath(file.name)}`;

        const title = TITLES[base] || humanize(base);
        const meta  = META[base] || '';
        const typeLabel = isPdf ? 'PDF' : 'IMG';
        const hours = HOURS[base];

        const thumb = isPdf
          ? `<div class="cert-pdf-canvas" data-pdf-url="${fileUrl}"></div>`
          : `<img src="${fileUrl}" alt="${title}" loading="lazy">`;

        return `
          <a href="${fileUrl}" target="_blank" rel="noopener" class="cert-card">
            <span class="cert-type">${typeLabel}</span>
            ${hours ? `
                <span class="cert-hours" title="Объём программы">
                    <span class="cert-hours__icon" aria-hidden="true">⏱</span>
                    <span class="cert-hours__value">${hours} ${pluralHours(hours)}</span>
                </span>
                ` : ''}
            <div class="cert-thumb">${thumb}</div>
            <div class="cert-info">
              <h3 class="cert-title">${title}</h3>
              ${meta ? `<p class="cert-meta">${meta}</p>` : ''}
            </div>
            <span class="cert-open" aria-hidden="true">↗</span>
          </a>
        `;
      }).join('');
    }

    loadCertificates();

// После построения галереи — рендерим превью для PDF
    async function renderPdfThumbnails() {
  const containers = document.querySelectorAll('.cert-pdf-canvas');

  const observer = new IntersectionObserver(async (entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const el = entry.target;
      observer.unobserve(el); // рендерим один раз

      const url = el.dataset.pdfUrl;
      try {
        const pdf = await pdfjsLib.getDocument(url).promise;
        const page = await pdf.getPage(1);

        const baseViewport = page.getViewport({ scale: 1 });
        // ↓ уменьшите targetWidth, чтобы рендерить быстрее и легче
        const targetWidth = 300;
        const scale = targetWidth / baseViewport.width;
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');

        await page.render({ canvasContext: ctx, viewport }).promise;

        el.innerHTML = '';
        el.appendChild(canvas);
      } catch (err) {
        el.innerHTML = '<div class="cert-pdf-fallback">PDF</div>';
      }
    }
  }, { rootMargin: '200px' }); // начинать за 200px до появления

  containers.forEach(el => observer.observe(el));
}
    // Запускаем рендер после того, как галерея построена
    // (loadCertificates — асинхронная, поэтому ждём немного)
    setTimeout(renderPdfThumbnails, 500);
  </script>
