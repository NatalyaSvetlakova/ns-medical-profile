<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Архив научных публикаций — Светлакова Наталья</title>
  
    <!-- Подключение PDF.js для просмотра PDF без новых вкладок -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Указываем, где брать рабочий скрипт библиотеки
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  
  <meta name="description" content="Мои статьи по медицине и психосоматике. Автор — Светлакова Наталья.">
  <meta property="og:title" content="Мои статьи — Светлакова Наталья">
  <meta property="og:description" content="Статьи по медицине, психосоматике и здоровью.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://natalyasvetlakova.github.io/medical-certificates/articles.html">
  <meta property="og:image" content="https://natalyasvetlakova.github.io/medical-certificates/preview.jpg">

  <style>
    :root {
      --bg: #f5f8fb;
      --bg-card: #ffffff;
      --text: #1a2b3c;
      --text-muted: #5a7085;
      --primary: #0e6ba8;
      --primary-dark: #0a4f7c;
      --primary-soft: #e3f0f8;
      --accent: #2ec4b6;
      --gold: #c9a961;
      --paper: linear-gradient(135deg, #fdfbf9 0%, #f3ede6 100%);
      --border: #d9e3ec;
      --radius: 14px;
      --shadow-sm: 0 2px 10px rgba(14, 107, 168, 0.06);
      --shadow-lg: 0 18px 42px rgba(14, 107, 168, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 48px 24px 80px;
      line-height: 1.55;
      background-image:
        radial-gradient(circle at 10% 0%, rgba(14, 107, 168, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(46, 196, 182, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .container { max-width: 1240px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 56px; }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--primary);
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      margin: 0 0 12px;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin: 0 auto;
      max-width: 560px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      margin: 24px auto 0;
      border-radius: 3px;
      opacity: 0.85;
    }

    /* ===== Навигация ===== */
    .nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      border-radius: 100px;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      border: 1.5px solid transparent;
    }
    .nav a.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 6px 20px rgba(14, 107, 168, 0.3);
    }
    .nav a:not(.active) {
      background: var(--bg-card);
      color: var(--primary);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }
    .nav a:not(.active):hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .nav .nav-svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav a:hover .nav-svg {
      transform: translateY(-1px) scale(1.08);
    }

    /* ===== Галерея статей ===== */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 28px;
    }

    .article-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition:
        transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.3s ease;
    }

    .article-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(14, 107, 168, 0.3);
    }

    .article-thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .article-thumb::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(201, 169, 97, 0.35);
      border-radius: 8px;
      pointer-events: none;
      transition: border-color 0.4s ease, inset 0.4s ease;
    }

    .article-card:hover .article-thumb::before {
      border-color: rgba(201, 169, 97, 0.9);
      inset: 6px;
    }

    .article-thumb img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(80, 60, 40, 0.12);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.4s ease;
      z-index: 1;
    }

    .article-card:hover .article-thumb img {
      transform: scale(1.04);
      box-shadow: 0 12px 30px rgba(80, 60, 40, 0.22);
    }

    .article-info {
      padding: 16px 18px 18px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .article-title {
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: 1.02rem;
      margin: 0;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-type {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--primary);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 4px 9px;
      border-radius: 100px;
      border: 1px solid rgba(14, 107, 168, 0.2);
      text-transform: uppercase;
    }

    .article-date-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px 5px 9px;
      border-radius: 100px;
      background: linear-gradient(135deg, #5c7185 0%, #3d4f60 100%);
      color: #f1f6fa;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 3px 10px rgba(45, 60, 75, 0.35);
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1;
      pointer-events: none;
    }

    .article-open {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 2;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      box-shadow: 0 6px 16px rgba(14, 107, 168, 0.4);
    }

    .article-card:hover .article-open {
      opacity: 1;
      transform: translateY(0);
    }

    .loading, .error {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      font-size: 1rem;
    }

    .loading::before {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 3px solid var(--primary-soft);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: var(--primary); }

    /* ===== Переключатель темы ===== */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle:hover {
      transform: scale(1.1);
      box-shadow: var(--shadow-lg);
    }
    .theme-toggle .theme-svg {
      width: 20px;
      height: 20px;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .theme-toggle:hover .theme-svg { transform: rotate(-15deg) scale(1.08); }
    .theme-toggle .theme-svg--sun { display: none; }
    .theme-toggle .theme-svg--moon { display: block; }
    html[data-theme="dark"] .theme-toggle .theme-svg--sun { display: block; }
    html[data-theme="dark"] .theme-toggle .theme-svg--moon { display: none; }

    /* ===== Кнопка «Наверх» ===== */
    .scroll-top {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 90;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--primary);
      cursor: pointer;
      padding: 0;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }
    .scroll-top svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }
    .scroll-top.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .scroll-top:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }

    /* ===== Футер ===== */
    .site-footer {
      margin-top: 80px;
      padding: 40px 24px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .footer-inner { max-width: 850px; margin: 0 auto; text-align: center; }
    .footer-copy { font-size: 0.9rem; color: var(--text); font-weight: 500; margin-bottom: 8px; }
    .footer-sep { margin: 0 8px; opacity: 0.5; }
    .footer-links { margin-bottom: 16px; font-size: 0.88rem; }
    .footer-links a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer-links a:hover { color: var(--primary-dark); text-decoration: underline; }
    .footer-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.55;
      opacity: 0.85;
    }

    /* ===== Тёмная тема ===== */
    html[data-theme="dark"] {
      --bg: #0f1a24;
      --bg-card: #16232f;
      --text: #e6eef5;
      --text-muted: #8fa4b8;
      --border: #23333f;
      --primary: #4da6d9;
      --primary-dark: #2b7bb0;
      --primary-soft: rgba(77, 166, 217, 0.15);
      --accent: #45d6c7;
      --paper: linear-gradient(135deg, #1a2733 0%, #111c26 100%);
      --gold: #d4b274;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.6);
    }
    html[data-theme="dark"] body {
      background-image:
        radial-gradient(circle at 10% 0%, rgba(77, 166, 217, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(69, 214, 199, 0.06) 0%, transparent 40%);
    }
    html[data-theme="dark"] .article-type {
      background: rgba(22, 35, 47, 0.9);
      color: var(--primary);
      border-color: rgba(77, 166, 217, 0.3);
    }

    /* ===== Модальное окно для просмотра ===== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal.is-open { display: flex; }

    .modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 18, 30, 0.88);
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .modal.is-open .modal__backdrop { opacity: 1; }

    html[data-theme="light"] .modal__backdrop,
    html:not([data-theme="dark"]) .modal__backdrop {
      background: rgba(230, 240, 250, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .modal__content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .modal.is-open .modal__content { opacity: 1; transform: scale(1); }

    .modal__header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 22px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .modal__back, .modal__theme {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 100px;
      border: 1px solid rgba(74, 159, 212, 0.35);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #2a5b7e;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 4px 16px rgba(74, 159, 212, 0.18);
    }

    .modal__back:hover, .modal__theme:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .modal__theme {
      width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 50%;
    }
    .modal__theme .theme-svg { width: 20px; height: 20px; }
    .modal__theme .theme-svg--sun { display: none; }
    .modal__theme .theme-svg--moon { display: block; }
    html[data-theme="dark"] .modal__theme .theme-svg--sun { display: block; }
    html[data-theme="dark"] .modal__theme .theme-svg--moon { display: none; }

    html[data-theme="dark"] .modal__back,
    html[data-theme="dark"] .modal__theme {
      background: rgba(30, 55, 80, 0.7);
      border-color: rgba(107, 182, 224, 0.35);
      color: #cfe6f5;
    }
    html[data-theme="dark"] .modal__back:hover,
    html[data-theme="dark"] .modal__theme:hover {
      background: var(--primary);
      color: #0d1b2a;
    }

    .modal__body {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 88px 24px 48px;
      overflow: auto;
    }

    .modal__body img {
      max-width: 100%;
      max-height: calc(100vh - 160px);
      width: auto;
      height: auto;
      display: block;
      padding: 10px;
      background: #ffffff;
      border: 1px solid rgba(74, 159, 212, 0.35);
      border-radius: 14px;
      box-shadow: 0 30px 90px rgba(8, 18, 30, 0.55);
      animation: fadeInImg 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* PDF-вьюер: прокручиваемый iframe */
    .modal__body iframe.pdf-viewer {
      width: 100%;
      max-width: 1000px;
      height: calc(100vh - 160px);
      border: 1px solid rgba(74, 159, 212, 0.35);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 30px 90px rgba(8, 18, 30, 0.55);
      animation: fadeInImg 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

        /* ===== Просмотрщик PDF на базе PDF.js ===== */
    .pdf-js-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeInImg 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Стили для каждой страницы PDF (выглядит как лист бумаги) */
    .pdf-js-container canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(8, 18, 30, 0.25);
      border: 1px solid rgba(74, 159, 212, 0.2);
    }

    /* Тёмная тема для страниц PDF */
    html[data-theme="dark"] .pdf-js-container canvas {
      background: #e6eef5; /* Слегка тонируем бумагу, чтобы глаза не болели в темноте */
    }

    /* Индикатор загрузки PDF */
    .pdf-loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 1rem;
    }
    .pdf-loading::before {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 3px solid var(--primary-soft);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    /* Заглушка, если PDF не грузится */
    .pdf-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px;
      color: var(--text);
      text-align: center;
      background: var(--bg-card);
      border-radius: 14px;
      border: 1px solid var(--border);
      max-width: 500px;
      box-shadow: var(--shadow-lg);
    }
    .pdf-fallback__icon { font-size: 4rem; }
    .pdf-fallback__title {
      font-family: Georgia, serif;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .pdf-fallback__link {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 100px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .pdf-fallback__link:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    @keyframes fadeInImg {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    body.modal-open { overflow: hidden; }

    /* ===== Адаптив ===== */
    @media (max-width: 600px) {
      body { padding: 28px 16px 60px; }
      header { margin-bottom: 36px; }
      .gallery {
        gap: 18px;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
      .modal__header { padding: 14px 16px; }
      .modal__back { padding: 9px 16px; font-size: 0.83rem; }
      .modal__theme { width: 40px; height: 40px; }
      .modal__body { padding: 70px 12px 24px; }
      .modal__body img { max-height: calc(100vh - 130px); padding: 8px; }
      .modal__body iframe.pdf-viewer { height: calc(100vh - 130px); }
    }
        /* ===== Кнопка «Наверх» внутри модального окна ===== */
    .modal__scroll-top {
      position: absolute;
      bottom: 28px;
      right: 28px;
      z-index: 25;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(74, 159, 212, 0.35);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #2a5b7e;
      cursor: pointer;
      padding: 0;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 16px rgba(74, 159, 212, 0.25);
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition:
        opacity 0.3s ease,
        visibility 0.3s ease,
        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.3s ease,
        background-color 0.3s ease,
        color 0.3s ease;
    }
    .modal__scroll-top svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .modal__scroll-top.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .modal__scroll-top:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 10px 26px rgba(74, 159, 212, 0.45);
      transform: translateY(-3px);
    }
    .modal__scroll-top:hover svg {
      transform: translateY(-2px);
    }
    .modal__scroll-top:active {
      transform: translateY(-1px) scale(0.96);
    }

    /* Тёмная тема */
    html[data-theme="dark"] .modal__scroll-top {
      background: rgba(30, 55, 80, 0.7);
      border-color: rgba(107, 182, 224, 0.35);
      color: #cfe6f5;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    html[data-theme="dark"] .modal__scroll-top:hover {
      background: var(--primary);
      color: #0d1b2a;
    }

    @media (max-width: 600px) {
      .modal__scroll-top {
        bottom: 16px;
        right: 16px;
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему">

    </svg>

      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>

  <div class="container">
    <header>
      <h1>Архив научных публикаций</h1>
      <p class="subtitle">Светлакова Наталья</p>
      <div class="divider"></div>
    </header>

    <nav class="nav">
      <a href="index.html">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <a href="articles.html" class="active">
        <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-copy">

        <span class="footer-sep">·</span>
        Все права защищены

      <div class="footer-links">
        <a href="https://github.com/NatalyaSvetlakova" target="_blank" rel="noopener">GitHub</a>
        <span class="footer-sep">·</span>
        <a href="https://vk.ru/n_svetlakova" target="_blank" rel="noopener">ВКонтакте</a>
      </div>
      <div class="footer-note">
        Материалы сайта (сертификаты, статьи, изображения) являются интеллектуальной собственностью автора.
        Копирование без письменного разрешения запрещено.

  <button id="scroll-top" class="scroll-top" aria-label="Наверх">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5"/>
      <path d="M5 12l7-7 7 7"/>
    </svg>
  </button>

  <!-- ===== Модальное окно для просмотра ===== -->
  <div class="modal" id="article-modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__content" role="dialog" aria-modal="true">
      <div class="modal__header">
        <button class="modal__back" data-close>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>Назад</span>
        </button>
        <button class="modal__theme" id="modal-theme-toggle" aria-label="Переключить тему">
          <svg class="theme-svg theme-svg--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="theme-svg theme-svg--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </div>
      <div class="modal__body" id="article-modal-body"></div>
    
            <!-- Кнопка «Наверх» для модального окна -->
      <button class="modal__scroll-top" id="modal-scroll-top" aria-label="Наверх">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5"/>
          <path d="M5 12l7-7 7 7"/>
        </svg>
      </button>
    
    </div>
  </div>

  <script>
    const OWNER  = 'NatalyaSvetlakova';
    const REPO   = 'ns-medical-profile';
    // ===== Переключатель темы =====
    (function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);

      const btn = document.getElementById('theme-toggle');
      btn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    })();

    // ===== Кнопка «Наверх» =====
    (function initScrollTop() {
      const btn = document.getElementById('scroll-top');
      if (!btn) return;
      function updateVisibility() {
        if (window.scrollY > 320) btn.classList.add('is-visible');
        else btn.classList.remove('is-visible');
      }
      window.addEventListener('scroll', updateVisibility, { passive: true });
      updateVisibility();
      btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    })();

    // ===== Автогод в футере =====
    (function setFooterYear() {
      const el = document.getElementById('footer-year');
      if (el) el.textContent = new Date().getFullYear();
    })();

    // ===== Загрузка статей =====
    const gallery = document.getElementById('gallery');

    function shortDate(iso) {
      const d = new Date(iso);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }

    function getExt(name) {
      const i = name.lastIndexOf('.');
      return i === -1 ? '' : name.slice(i + 1).toLowerCase();
    }

    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">' +
      '<rect fill="#e3f0f8" width="400" height="300"/>' +
      '<text x="50%" y="48%" fill="#0e6ba8" font-family="Georgia" font-size="22" ' +
      'text-anchor="middle" dy=".3em">Статья</text>' +
      '<text x="50%" y="62%" fill="#5a7085" font-family="Georgia" font-size="14" ' +
      'text-anchor="middle" dy=".3em">PDF / JPG / PNG</text></svg>'
    );

    async function loadArticles() {
      try {
        const res = await fetch('articles.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const articles = await res.json();

        if (!articles.length) {
          gallery.innerHTML = '<div class="error">Пока нет статей.</div>';
          return;
        }

        articles.sort((a, b) => new Date(b.date) - new Date(a.date));

          gallery.innerHTML = articles.map(a => {
          const ext = getExt(a.url || '');
          const isPdf = ext === 'pdf';
          const isExternal = a.external === true;
          
          // Определяем тип и метку
          let typeLabel;
          if (isExternal) {
            typeLabel = 'ССЫЛКА';
          } else if (isPdf) {
            typeLabel = 'PDF';
          } else {
            typeLabel = 'IMG';
          }
          
          const thumbSrc = a.image || PLACEHOLDER;
          
          // Формируем атрибуты карточки
          // Для внешних ссылок — target="_blank", открывается в новой вкладке
          // Для PDF/IMG — data-атрибуты, открывается в модалке
          const cardAttrs = isExternal
            ? `href="${a.url}" target="_blank" rel="noopener" data-external="true"`
            : `href="${a.url}" data-file-url="${a.url}" data-file-type="${isPdf ? 'pdf' : 'image'}" data-file-title="${(a.title || '').replace(/"/g, '&quot;')}"`;
          
          return `
            <a ${cardAttrs} class="article-card">
              <span class="article-type ${isExternal ? 'is-link' : ''}">${typeLabel}</span>
              <span class="article-date-badge">
                <span aria-hidden="true">📅</span>
                <span>${shortDate(a.date)}</span>
              </span>
              <div class="article-thumb">
                <img src="${thumbSrc}" alt="${a.title}" loading="lazy"
                     onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
              </div>
              <div class="article-info">
                <h3 class="article-title">${a.title}</h3>
                ${a.description ? `<p class="article-meta">${a.description}</p>` : ''}
              </div>
              <span class="article-open" aria-hidden="true">↗</span>
            </a>
          `;
        }).join('');
      } catch (err) {
        gallery.innerHTML = `<div class="error">Не удалось загрузить статьи.<br>${err.message}</div>`;
      }
    }

    loadArticles();

    // ===== Модальное окно с поддержкой PDF.js =====
    (function initModal() {
      const modal = document.getElementById('article-modal');
      const body = document.getElementById('article-modal-body');
      let lastFocused = null;

      // Новая функция: отрисовка PDF через PDF.js
      async function renderPdf(url, container) {
        try {
          const loadingTask = pdfjsLib.getDocument(url);
          const pdf = await loadingTask.promise;

          container.innerHTML = ''; // Убираем индикатор загрузки

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 }); // Масштаб 1.5 — хорошее качество

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            container.appendChild(canvas);

            const renderContext = {
              canvasContext: context,
              viewport: viewport
            };
            
            await page.render(renderContext).promise;
          }
        } catch (err) {
          console.error('Ошибка PDF.js:', err);
          container.innerHTML = `
            <div class="error" style="color: var(--text);">
              Не удалось отобразить PDF.<br>
              <span style="font-size: 0.85rem; color: var(--text-muted);">${err.message}</span>
            </div>
          `;
        }
      }

      function openModal(url, type, title) {
        lastFocused = document.activeElement;
        body.innerHTML = '';
        body.scrollTop = 0; // сброс скролла наверх
        // Скрываем кнопку «Наверх» при открытии новой статьи
        const btn = document.getElementById('modal-scroll-top');
        if (btn) btn.classList.remove('is-visible');        

        if (type === 'pdf') {
          const pdfContainer = document.createElement('div');
          pdfContainer.className = 'pdf-js-container';
          
          // Показываем загрузку
          pdfContainer.innerHTML = '<div class="pdf-loading">Загрузка PDF...</div>';
          body.appendChild(pdfContainer);

          // Запускаем отрисовку
          renderPdf(url, pdfContainer);
        } else {
          const img = document.createElement('img');
          img.src = url;
          img.alt = title || '';
          body.appendChild(img);
        }

        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');
      }

      function closeModal() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
        setTimeout(() => { body.innerHTML = ''; }, 400);
        if (lastFocused && lastFocused.focus) lastFocused.focus();
      }

      // Перехват клика по карточке
      document.addEventListener('click', function (e) {
        const card = e.target.closest('.article-card');
        if (!card) return;
        
        // ПРОВЕРКА: если это внешняя ссылка, даём браузеру открыть её самому
        if (card.hasAttribute('target') && card.getAttribute('target') === '_blank') {
          return; // Выходим, не перехватывая клик
        }
        
        const url = card.getAttribute('data-file-url');
        if (!url) return;

        e.preventDefault();
        const type = card.getAttribute('data-file-type') || 'image';
        const title = card.getAttribute('data-file-title') || '';
        openModal(url, type, title);
      }, true);

      // Закрытие
      document.addEventListener('click', function (e) {
        if (e.target.closest('[data-close]')) {
          e.preventDefault();
          closeModal();
        }
      });

      // Переключатель темы внутри модалки
      const modalThemeBtn = document.getElementById('modal-theme-toggle');
      if (modalThemeBtn) {
        modalThemeBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
        });
      }

      // Escape
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
      });
            // ===== Кнопка «Наверх» внутри модалки =====
      const modalScrollBtn = document.getElementById('modal-scroll-top');
      if (modalScrollBtn) {
        // Показываем/скрываем кнопку при прокрутке тела модалки
        body.addEventListener('scroll', function () {
          if (body.scrollTop > 200) {
            modalScrollBtn.classList.add('is-visible');
          } else {
            modalScrollBtn.classList.remove('is-visible');
          }
        }, { passive: true });

        // Клик — плавный скролл наверх
        modalScrollBtn.addEventListener('click', function () {
          body.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    })();
  </script>
</body>
